spring.application.name=SyncWatch
server.port=8080
syncwatch.frontend-origin=http://localhost:5173
syncwatch.google.client-id=${GOOGLE_CLIENT_ID:}
syncwatch.google.client-secret=${GOOGLE_CLIENT_SECRET:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SYNCWATCH_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
syncwatch.websocket.presence-grace=${SYNCWATCH_WEBSOCKET_PRESENCE_GRACE:30s}
syncwatch.remember-me.duration=30d
syncwatch.remember-me.cookie-secure=${SYNCWATCH_COOKIE_SECURE:false}
syncwatch.public-url=${SYNCWATCH_PUBLIC_URL:http://localhost:5173}
syncwatch.password-reset.duration=${SYNCWATCH_PASSWORD_RESET_DURATION:30m}
syncwatch.mail.enabled=${SYNCWATCH_MAIL_ENABLED:false}
syncwatch.mail.from=${SYNCWATCH_MAIL_FROM:}
syncwatch.mail.from-name=${SYNCWATCH_MAIL_FROM_NAME:SyncWatch}
spring.mail.host=${SYNCWATCH_SMTP_HOST:localhost}
spring.mail.port=${SYNCWATCH_SMTP_PORT:587}
spring.mail.username=${SYNCWATCH_SMTP_USERNAME:}
spring.mail.password=${SYNCWATCH_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SYNCWATCH_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SYNCWATCH_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.datasource.url=${SYNCWATCH_DATABASE_URL:jdbc:h2:file:./syncwatch-users;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SYNCWATCH_DATABASE_USERNAME:sa}
spring.datasource.password=${SYNCWATCH_DATABASE_PASSWORD:}
spring.sql.init.mode=always

