spring.application.name=SyncWatch
server.port=8080
syncwatch.frontend-origin=http://localhost:5173
syncwatch.google.client-id=${GOOGLE_CLIENT_ID:}
syncwatch.google.client-secret=${GOOGLE_CLIENT_SECRET:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SYNCWATCH_COOKIE_SECURE:false}

